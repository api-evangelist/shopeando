aid: shopeando
name: Shopeando
description: Shopeando is a Mexican technology and logistics startup that manages the full international
  shipping process, enabling businesses and individuals to import and export merchandise between China,
  Europe, the United States and Mexico. Through its platform it coordinates cross-border logistics, customs
  handling and last-mile delivery, and provides dedicated import, export and e-commerce fulfillment services
  for online stores. Shopeando is backed by 500 Global.
